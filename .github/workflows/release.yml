name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  SIGNING_CERT_SHA256: 0d81ab7cb1a16d58d91a953fe62049eb77fc840cc544a297ae1854f54bc73b96

jobs:
  apk:
    if: github.event.release.tag_name == 'v1.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p ~/.android
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sha256sum | grep -F "$SIGNING_CERT_SHA256"
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build and check
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon
      - name: Verify APK signature and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          signature=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$signature"
          printf '%s\n' "$signature" | grep -F "certificate SHA-256 digest: $SIGNING_CERT_SHA256"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | grep -F "versionName='${RELEASE_TAG#v}'"
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Interlude-1.0.1.apk
          gh release upload "$RELEASE_TAG" Interlude-1.0.1.apk --clobber
      - name: Remove signing key
        if: always()
        run: rm -f ~/.android/debug.keystore
